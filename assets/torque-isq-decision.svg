<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img" aria-labelledby="tq-title tq-desc">
  <title id="tq-title">Intraoperative torque and ISQ decision for immediate load versus staging</title>
  <desc id="tq-desc">Decision pathway. Record insertion torque and ISQ for every implant. If every implant meets your written threshold (commonly at least 30 to 35 Ncm and ISQ about 60 to 65) with adequate number and A-P spread, proceed to multi-unit abutments and same-day conversion. If one implant is low, try to rescue it with a longer or wider implant or a new site; if that fails, leave it out of the provisional under a cover screw and load the rest only if number and spread remain adequate. If two or more are low or spread is inadequate, stage: cover screws or healing abutments and a relined removable interim, loading after integration. Never exceed the system maximum insertion torque in dense bone.</desc>
  <defs>
    <marker id="tq-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
    <filter id="tq-soft" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="720" height="600" fill="#f8fafc"/>
  <g font-family="system-ui,sans-serif">
    <text x="360" y="28" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="700">Torque / ISQ go/no-go — decide by the numbers you wrote down</text>

    <rect x="200" y="46" width="320" height="56" rx="10" fill="#0f766e" filter="url(#tq-soft)"/>
    <text x="360" y="70" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Each implant: torque + ISQ recorded</text>
    <text x="360" y="88" text-anchor="middle" fill="#ccfbf1" font-size="11">Circulator logs site · size · lot · Ncm · ISQ</text>
    <line x1="360" y1="102" x2="360" y2="128" stroke="#334155" stroke-width="2" marker-end="url(#tq-arrow)"/>

    <rect x="150" y="130" width="420" height="58" rx="10" fill="#fff" stroke="#0f766e" stroke-width="2" filter="url(#tq-soft)"/>
    <text x="360" y="153" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="700">All implants ≥ your threshold?</text>
    <text x="360" y="172" text-anchor="middle" fill="#64748b" font-size="11">Teaching range: ≥30–35 Ncm · ISQ ≥60–65 (adjunct) · per your plan</text>

    <!-- branches -->
    <line x1="150" y1="159" x2="100" y2="159" stroke="#334155" stroke-width="2"/>
    <line x1="100" y1="159" x2="100" y2="232" stroke="#334155" stroke-width="2" marker-end="url(#tq-arrow)"/>
    <text x="106" y="200" fill="#0f766e" font-size="11" font-weight="800">YES</text>
    <line x1="360" y1="188" x2="360" y2="232" stroke="#334155" stroke-width="2" marker-end="url(#tq-arrow)"/>
    <text x="368" y="214" fill="#b45309" font-size="11" font-weight="800">ONE low</text>
    <line x1="570" y1="159" x2="620" y2="159" stroke="#334155" stroke-width="2"/>
    <line x1="620" y1="159" x2="620" y2="232" stroke="#334155" stroke-width="2" marker-end="url(#tq-arrow)"/>
    <text x="560" y="214" fill="#b91c1c" font-size="11" font-weight="800">2+ low / poor spread</text>

    <!-- GO column -->
    <rect x="20" y="234" width="200" height="120" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="120" y="258" text-anchor="middle" fill="#065f46" font-size="13" font-weight="800">GO · immediate load</text>
    <text x="120" y="280" text-anchor="middle" fill="#047857" font-size="11">Adequate number + A-P spread</text>
    <text x="120" y="296" text-anchor="middle" fill="#047857" font-size="11">Seat MUAs (torque per IFU)</text>
    <text x="120" y="312" text-anchor="middle" fill="#047857" font-size="11">Radiograph seating</text>
    <text x="120" y="328" text-anchor="middle" fill="#047857" font-size="11">Close → conversion (Wk 4)</text>

    <!-- CAUTION column -->
    <rect x="250" y="234" width="220" height="150" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="360" y="258" text-anchor="middle" fill="#92400e" font-size="13" font-weight="800">CAUTION · rescue first</text>
    <text x="360" y="280" text-anchor="middle" fill="#b45309" font-size="11">Longer / wider implant, deeper</text>
    <text x="360" y="296" text-anchor="middle" fill="#b45309" font-size="11">cortical engagement, or new site</text>
    <text x="360" y="318" text-anchor="middle" fill="#92400e" font-size="11" font-weight="700">Still low?</text>
    <text x="360" y="336" text-anchor="middle" fill="#b45309" font-size="11">Cover screw · leave it out of</text>
    <text x="360" y="352" text-anchor="middle" fill="#b45309" font-size="11">the provisional — load the rest</text>
    <text x="360" y="368" text-anchor="middle" fill="#b45309" font-size="11">only if number + spread OK</text>

    <!-- NO column -->
    <rect x="500" y="234" width="200" height="150" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="600" y="258" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="800">NO · stage it</text>
    <text x="600" y="280" text-anchor="middle" fill="#b91c1c" font-size="11">Cover screws or healing</text>
    <text x="600" y="296" text-anchor="middle" fill="#b91c1c" font-size="11">abutments per plan</text>
    <text x="600" y="318" text-anchor="middle" fill="#b91c1c" font-size="11">Relined removable interim</text>
    <text x="600" y="334" text-anchor="middle" fill="#b91c1c" font-size="11">(soft reline, no pressure)</text>
    <text x="600" y="356" text-anchor="middle" fill="#b91c1c" font-size="11">Load after integration</text>

    <line x1="360" y1="384" x2="360" y2="410" stroke="#334155" stroke-width="1.5"/>
    <line x1="360" y1="410" x2="120" y2="410" stroke="#334155" stroke-width="1.5"/>
    <line x1="120" y1="410" x2="120" y2="358" stroke="#334155" stroke-width="1.5" marker-end="url(#tq-arrow)"/>
    <text x="240" y="404" text-anchor="middle" fill="#64748b" font-size="10">enough remain → GO</text>
    <line x1="470" y1="300" x2="498" y2="300" stroke="#334155" stroke-width="1.5" marker-end="url(#tq-arrow)"/>

    <!-- Over-torque warning -->
    <rect x="20" y="430" width="680" height="70" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="360" y="455" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="800">Dense bone: more torque is not always better</text>
    <text x="360" y="474" text-anchor="middle" fill="#334155" font-size="11">Torque climbing toward the system maximum? Stop, back out, use the dense-bone drill / tap per IFU, re-insert.</text>
    <text x="360" y="490" text-anchor="middle" fill="#334155" font-size="11">Overcompression of dense cortical bone is a reported cause of early failure (compression necrosis).</text>

    <!-- soft bone tip -->
    <rect x="20" y="512" width="680" height="62" rx="10" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="360" y="536" text-anchor="middle" fill="#0f766e" font-size="13" font-weight="800">Soft bone: plan for torque before you drill</text>
    <text x="360" y="556" text-anchor="middle" fill="#334155" font-size="11">Under-prepare (skip/stop the last drill per IFU), longer tapered implants, engage cortical bone (nasal / sinus floor).</text>
    <text x="700" y="592" text-anchor="end" fill="#64748b" font-size="9">Teaching ranges, not protocol. Your written thresholds and system IFU decide.</text>
  </g>
</svg>

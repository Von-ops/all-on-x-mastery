<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="ms-title ms-desc">
  <title id="ms-title">Multi-unit abutment selection on surgery day: cuff height and angle</title>
  <desc id="ms-desc">Left panel: three cuff heights on the same implant with 3 millimeters of soft tissue. A cuff that is too short leaves the abutment platform buried under tissue; a cuff that matches tissue depth puts the platform at or just above the tissue; a cuff that is too tall exposes metal and eats prosthetic space. Right panel: choose straight, 17 degree or 30 degree abutments by the angle between the implant and the common path of insertion, then index the angled abutment so the screw channel exits occlusal or lingual, torque per the manufacturer instructions, verify with a radiograph and protect with a healing or protection cap.</desc>
  <defs>
    <marker id="ms-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="720" height="500" fill="#f8fafc"/>
  <g font-family="system-ui,sans-serif">
    <text x="360" y="28" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="700">MUA selection — measure tissue, match angle, index, torque per IFU</text>

    <!-- Panel 1: cuff height -->
    <rect x="20" y="45" width="330" height="430" rx="12" fill="#fff" stroke="#e2e8f0"/>
    <text x="185" y="70" text-anchor="middle" fill="#0e7490" font-size="13" font-weight="800">1 · Cuff (collar) height</text>
    <text x="185" y="88" text-anchor="middle" fill="#64748b" font-size="10">Depth gauge: bone/implant platform → tissue margin</text>

    <!-- three columns at x=80,185,290 -->
    <!-- bone -->
    <rect x="34" y="300" width="302" height="110" fill="#d6d3d1"/>
    <!-- tissue -->
    <rect x="34" y="262" width="302" height="38" fill="#fda4af" opacity="0.75"/>
    <text x="114" y="285" fill="#9f1239" font-size="9" font-weight="700">tissue 3 mm</text>
    <text x="40" y="404" fill="#57534e" font-size="9">reduced bone</text>

    <!-- implants -->
    <rect x="68" y="300" width="24" height="96" rx="5" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>
    <rect x="173" y="300" width="24" height="96" rx="5" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>
    <rect x="278" y="300" width="24" height="96" rx="5" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>

    <!-- too short: cuff 1 mm -->
    <rect x="70" y="287" width="20" height="13" fill="#0f766e"/>
    <rect x="66" y="279" width="28" height="8" rx="2" fill="#0f766e"/>
    <text x="80" y="140" text-anchor="middle" fill="#b91c1c" font-size="12" font-weight="800">Too short</text>
    <text x="80" y="156" text-anchor="middle" fill="#475569" font-size="10">platform buried;</text>
    <text x="80" y="170" text-anchor="middle" fill="#475569" font-size="10">tissue traps resin</text>
    <text x="80" y="184" text-anchor="middle" fill="#475569" font-size="10">and blocks seating</text>

    <!-- matched: cuff 3 mm (platform at/just above tissue) -->
    <rect x="175" y="262" width="20" height="38" fill="#0f766e"/>
    <rect x="171" y="252" width="28" height="10" rx="2" fill="#0f766e"/>
    <line x1="185" y1="252" x2="185" y2="214" stroke="#dc2626" stroke-width="3" stroke-dasharray="5 4"/>
    <text x="185" y="140" text-anchor="middle" fill="#059669" font-size="12" font-weight="800">Matched</text>
    <text x="185" y="156" text-anchor="middle" fill="#475569" font-size="10">platform at / just</text>
    <text x="185" y="170" text-anchor="middle" fill="#475569" font-size="10">above tissue;</text>
    <text x="185" y="184" text-anchor="middle" fill="#475569" font-size="10">cleansable, seatable</text>

    <!-- too tall: cuff 5 mm -->
    <rect x="280" y="236" width="20" height="64" fill="#0f766e"/>
    <rect x="276" y="226" width="28" height="10" rx="2" fill="#0f766e"/>
    <text x="290" y="140" text-anchor="middle" fill="#b45309" font-size="12" font-weight="800">Too tall</text>
    <text x="290" y="156" text-anchor="middle" fill="#475569" font-size="10">metal shows;</text>
    <text x="290" y="170" text-anchor="middle" fill="#475569" font-size="10">uses up prosthetic</text>
    <text x="290" y="184" text-anchor="middle" fill="#475569" font-size="10">space (thin PMMA)</text>

    <text x="185" y="438" text-anchor="middle" fill="#334155" font-size="11" font-weight="700">Choose the cuff that matches measured tissue depth</text>
    <text x="185" y="456" text-anchor="middle" fill="#64748b" font-size="10">(tissue thins after healing — confirm with your system's guidance)</text>

    <!-- Panel 2: angle -->
    <rect x="370" y="45" width="330" height="430" rx="12" fill="#fff" stroke="#e2e8f0"/>
    <text x="535" y="70" text-anchor="middle" fill="#0f766e" font-size="13" font-weight="800">2 · Angle → 3 · Index → 4 · Torque</text>
    <text x="535" y="88" text-anchor="middle" fill="#64748b" font-size="10">Angle between implant axis and common path of insertion</text>

    <rect x="390" y="104" width="290" height="40" rx="8" fill="#ecfdf5" stroke="#059669"/>
    <text x="405" y="129" fill="#065f46" font-size="12" font-weight="800">≈0–10°</text>
    <text x="665" y="129" text-anchor="end" fill="#047857" font-size="11">Straight MUA (axial anteriors)</text>
    <rect x="390" y="152" width="290" height="40" rx="8" fill="#f0fdfa" stroke="#14b8a6"/>
    <text x="405" y="177" fill="#115e59" font-size="12" font-weight="800">≈10–25°</text>
    <text x="665" y="177" text-anchor="end" fill="#0f766e" font-size="11">17° (or system equivalent)</text>
    <rect x="390" y="200" width="290" height="40" rx="8" fill="#ecfeff" stroke="#0891b2"/>
    <text x="405" y="225" fill="#155e75" font-size="12" font-weight="800">≈25–45°</text>
    <text x="665" y="225" text-anchor="end" fill="#0e7490" font-size="11">30° (tilted posteriors)</text>
    <text x="535" y="258" text-anchor="middle" fill="#64748b" font-size="9">Bands are a teaching approximation — angle options and limits vary by system.</text>

    <!-- index sketch -->
    <rect x="449" y="318" width="22" height="58" rx="5" fill="#94a3b8" stroke="#334155" stroke-width="1.5" transform="rotate(-30 460 318)"/>
    <path d="M448,320 L472,320 L468,298 L452,298 Z" fill="#0f766e"/>
    <rect x="451" y="290" width="18" height="8" rx="2" fill="#0f766e"/>
    <line x1="460" y1="290" x2="460" y2="272" stroke="#dc2626" stroke-width="3" stroke-dasharray="5 4" marker-end="url(#ms-arrow)"/>
    <text x="492" y="290" fill="#0f766e" font-size="11" font-weight="800">Index / rotate</text>
    <text x="492" y="306" fill="#475569" font-size="10">until the channel exits</text>
    <text x="492" y="320" fill="#475569" font-size="10">occlusal or lingual —</text>
    <text x="492" y="334" fill="#b91c1c" font-size="10" font-weight="700">never facial</text>
    <rect x="390" y="378" width="290" height="80" rx="8" fill="#0f172a"/>
    <text x="535" y="400" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="800">Torque per manufacturer IFU</text>
    <text x="535" y="418" text-anchor="middle" fill="#94a3b8" font-size="10">Straight vs angled screws can differ — read the card</text>
    <text x="535" y="434" text-anchor="middle" fill="#94a3b8" font-size="10">Radiograph: fully seated, no gap</text>
    <text x="535" y="450" text-anchor="middle" fill="#94a3b8" font-size="10">Protection / healing cap on until pickup</text>
  </g>
</svg>

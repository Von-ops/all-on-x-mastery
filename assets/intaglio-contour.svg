<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="ic-title ic-desc">
  <title id="ic-title">Intaglio contour of the converted provisional: concave ridge-lap versus convex cleansable</title>
  <desc id="ic-desc">Two cross-sections through a converted prosthesis over a healing ridge with a multi-unit abutment and temporary cylinder. Left, wrong: the original denture flange and concave intaglio are left in place, trapping food and plaque, pressing on the healing tissue and blocking floss or water-flosser access. Right, right: flanges removed, the tissue surface is smooth, polished and convex to flat, with light or no pressure on the tissue and an open path for a water flosser or floss threader under the prosthesis.</desc>
  <rect width="720" height="420" fill="#f8fafc"/>
  <g font-family="system-ui,sans-serif">
    <text x="360" y="28" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="700">Tissue surface (intaglio) — make it convex, smooth and cleansable</text>
    <!-- left panel -->
    <rect x="20" y="44" width="330" height="356" rx="12" fill="#fff" stroke="#fecaca"/>
    <text x="185" y="68" text-anchor="middle" fill="#b91c1c" font-size="13" font-weight="800">✗ Left as a denture</text>
    <!-- bone & tissue -->
    <path d="M60,330 Q185,250 310,330 L310,380 L60,380 Z" fill="#d6d3d1"/>
    <path d="M60,330 Q185,250 310,330 L310,318 Q185,236 60,318 Z" fill="#fda4af"/>
    <rect x="175" y="250" width="20" height="100" rx="4" fill="#94a3b8" stroke="#334155"/>
    <rect x="172" y="200" width="26" height="52" rx="3" fill="#cbd5e1" stroke="#334155"/>
    <!-- prosthesis with flanges and concave intaglio -->
    <path d="M70,330 L70,190 Q70,120 185,110 Q300,120 300,190 L300,330 L282,330 L282,230 Q185,186 88,230 L88,330 Z" fill="#f9a8d4" stroke="#9d174d" stroke-width="1.5"/>
    <rect x="130" y="100" width="110" height="34" rx="6" fill="#fefce8" stroke="#a16207"/>
    <circle cx="110" cy="290" r="6" fill="#a16207"/><circle cx="262" cy="286" r="6" fill="#a16207"/>
    <text x="185" y="152" text-anchor="middle" fill="#831843" font-size="10">denture flanges kept</text>
    <g font-size="10" fill="#7f1d1d">
      <text x="34" y="396">food/plaque trap · pressure on healing tissue · no floss path</text>
    </g>
    <!-- right panel -->
    <rect x="370" y="44" width="330" height="356" rx="12" fill="#fff" stroke="#bbf7d0"/>
    <text x="535" y="68" text-anchor="middle" fill="#15803d" font-size="13" font-weight="800">✓ Converted</text>
    <path d="M410,330 Q535,250 660,330 L660,380 L410,380 Z" fill="#d6d3d1"/>
    <path d="M410,330 Q535,250 660,330 L660,318 Q535,236 410,318 Z" fill="#fda4af"/>
    <rect x="525" y="250" width="20" height="100" rx="4" fill="#94a3b8" stroke="#334155"/>
    <rect x="522" y="200" width="26" height="52" rx="3" fill="#cbd5e1" stroke="#334155"/>
    <path d="M450,200 Q450,120 535,110 Q620,120 620,200 Q590,236 548,236 L548,200 L522,200 L522,236 Q480,236 450,200 Z" fill="#f9a8d4" stroke="#9d174d" stroke-width="1.5"/>
    <rect x="480" y="100" width="110" height="34" rx="6" fill="#fefce8" stroke="#a16207"/>
    <path d="M440,262 Q470,244 515,240" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="5 4"/>
    <path d="M630,262 Q600,244 555,240" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="5 4"/>
    <text x="535" y="290" text-anchor="middle" fill="#0369a1" font-size="10">water-flosser / floss path</text>
    <g font-size="10" fill="#14532d">
      <text x="384" y="396">no flanges · convex-to-flat · polished · light/no tissue pressure</text>
    </g>
    <text x="535" y="160" text-anchor="middle" fill="#831843" font-size="10">temporary cylinder in resin</text>
  </g>
</svg>

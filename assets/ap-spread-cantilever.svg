<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="ap-title ap-desc">
  <title id="ap-title">A-P spread and distal cantilever limits</title>
  <desc id="ap-desc">Occlusal view of an edentulous arch with two anterior axial implants and two posterior tilted implants. The A-P spread is the distance from a line joining the most anterior implants to a line joining the most distal implant platforms. The distal cantilever is commonly limited to about 1.5 to 2 times the A-P spread, less in the maxilla or soft bone.</desc>
  <rect width="720" height="500" fill="#f8fafc"/>
  <text x="360" y="30" text-anchor="middle" fill="#0f172a" font-family="system-ui,sans-serif" font-size="16" font-weight="700">A-P spread &amp; cantilever — occlusal view</text>
  <!-- arch outline -->
  <path d="M110,430 C110,200 220,70 360,70 C500,70 610,200 610,430" fill="none" stroke="#d6d3d1" stroke-width="56" stroke-linecap="round"/>
  <path d="M110,430 C110,200 220,70 360,70 C500,70 610,200 610,430" fill="none" stroke="#a8a29e" stroke-width="2" stroke-dasharray="4 6"/>
  <!-- prosthesis outline -->
  <path d="M120,440 C120,210 225,82 360,82 C495,82 600,210 600,440" fill="none" stroke="#0f766e" stroke-width="5" opacity="0.35"/>
  <!-- anterior implants -->
  <circle cx="300" cy="96" r="13" fill="#0f766e"/>
  <circle cx="420" cy="96" r="13" fill="#0f766e"/>
  <text x="360" y="128" text-anchor="middle" fill="#0f766e" font-family="system-ui,sans-serif" font-size="11" font-weight="700">Axial anterior (lateral/canine area)</text>
  <!-- posterior tilted implant platforms (2nd premolar) -->
  <ellipse cx="165" cy="300" rx="15" ry="11" fill="#0891b2"/>
  <ellipse cx="555" cy="300" rx="15" ry="11" fill="#0891b2"/>
  <!-- tilt arrows toward mesial apex -->
  <line x1="165" y1="300" x2="190" y2="235" stroke="#0891b2" stroke-width="3" stroke-dasharray="5 4"/>
  <line x1="555" y1="300" x2="530" y2="235" stroke="#0891b2" stroke-width="3" stroke-dasharray="5 4"/>
  <text x="200" y="330" fill="#0e7490" font-family="system-ui,sans-serif" font-size="11" font-weight="700">Tilted posterior platform</text>
  <text x="200" y="345" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">(apex mesial; ~2nd PM emergence)</text>
  <!-- lines -->
  <line x1="150" y1="96" x2="570" y2="96" stroke="#1e3a5f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="150" y1="300" x2="570" y2="300" stroke="#1e3a5f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <!-- AP spread dimension -->
  <line x1="360" y1="100" x2="360" y2="296" stroke="#0f172a" stroke-width="2.5"/>
  <polygon points="360,100 354,114 366,114" fill="#0f172a"/>
  <polygon points="360,296 354,282 366,282" fill="#0f172a"/>
  <rect x="372" y="178" width="132" height="40" rx="8" fill="#fff" stroke="#0f172a"/>
  <text x="438" y="196" text-anchor="middle" fill="#0f172a" font-family="system-ui,sans-serif" font-size="13" font-weight="800">A-P spread</text>
  <text x="438" y="211" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="10">anterior line → distal line</text>
  <!-- cantilever -->
  <line x1="560" y1="304" x2="606" y2="430" stroke="#dc2626" stroke-width="4"/>
  <line x1="160" y1="304" x2="114" y2="430" stroke="#dc2626" stroke-width="4"/>
  <text x="625" y="372" fill="#b91c1c" font-family="system-ui,sans-serif" font-size="12" font-weight="800">Cantilever</text>
  <text x="625" y="388" fill="#b91c1c" font-family="system-ui,sans-serif" font-size="10">(distal of last</text>
  <text x="625" y="401" fill="#b91c1c" font-family="system-ui,sans-serif" font-size="10">platform)</text>
  <!-- rule box -->
  <rect x="190" y="400" width="340" height="80" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <text x="360" y="423" text-anchor="middle" fill="#0f172a" font-family="system-ui,sans-serif" font-size="12" font-weight="800">Commonly taught limits (teaching rule)</text>
  <text x="360" y="442" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="11">Mandible, dense bone: cantilever ≤ ~1.5–2 × A-P spread</text>
  <text x="360" y="458" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="11">Maxilla / soft bone / bruxer: shorter (≈1–1.5 ×) or add implants</text>
  <text x="360" y="473" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">Provisional: shorter still — often ≤ 1 tooth distal</text>
</svg>

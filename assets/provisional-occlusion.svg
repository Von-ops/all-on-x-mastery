<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="po-title po-desc">
  <title id="po-title">Occlusion and cantilever on the immediate provisional</title>
  <desc id="po-desc">Occlusal view of a four-implant arch. The anterior-posterior spread is measured from a line through the most anterior implants to a line through the distal edges of the most distal implants. The distal cantilever is kept short; in Drago's 2017 series of interim acrylic All-on-Four prostheses, mean cantilevers were about 9 to 10 millimeters and cantilever to A-P ratios of about 0.5 to 0.6 generally performed well. Contacts: even, bilateral, simultaneous light centric contacts over the implant-supported segment; light or no contact on the cantilever; shallow anterior guidance; remove working and non-working interferences; narrow, flat occlusal tables.</desc>
  <rect width="720" height="440" fill="#f8fafc"/>
  <g font-family="system-ui,sans-serif">
    <text x="360" y="28" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="700">Provisional biomechanics — short cantilever, spread-out light contacts</text>
    <!-- arch -->
    <path d="M110,380 Q110,90 360,80 Q610,90 610,380" fill="none" stroke="#f9a8d4" stroke-width="56" stroke-linecap="round"/>
    <!-- implants -->
    <g fill="#475569" stroke="#0f172a">
      <circle cx="285" cy="104" r="10"/><circle cx="435" cy="104" r="10"/>
      <circle cx="160" cy="230" r="10"/><circle cx="560" cy="230" r="10"/>
    </g>
    <!-- AP spread lines -->
    <line x1="230" y1="104" x2="490" y2="104" stroke="#0e7490" stroke-dasharray="5 4"/>
    <line x1="130" y1="240" x2="590" y2="240" stroke="#0e7490" stroke-dasharray="5 4"/>
    <line x1="360" y1="104" x2="360" y2="240" stroke="#0e7490" stroke-width="2"/>
    <text x="370" y="180" fill="#0e7490" font-size="12" font-weight="700">A-P spread</text>
    <!-- cantilever -->
    <line x1="560" y1="240" x2="606" y2="320" stroke="#c2410c" stroke-width="3"/>
    <line x1="160" y1="240" x2="114" y2="320" stroke="#c2410c" stroke-width="3"/>
    <text x="618" y="300" fill="#c2410c" font-size="12" font-weight="700">cantilever</text>
    <text x="618" y="316" fill="#c2410c" font-size="10">keep short</text>
    <!-- contacts -->
    <g fill="#16a34a"><circle cx="240" cy="130" r="6"/><circle cx="480" cy="130" r="6"/><circle cx="185" cy="185" r="6"/><circle cx="535" cy="185" r="6"/><circle cx="160" cy="262" r="6"/><circle cx="560" cy="262" r="6"/></g>
    <g fill="none" stroke="#dc2626" stroke-width="2"><circle cx="128" cy="320" r="7"/><circle cx="592" cy="320" r="7"/></g>
    <!-- legend -->
    <rect x="200" y="300" width="320" height="120" rx="10" fill="#fff" stroke="#e2e8f0"/>
    <g font-size="11" fill="#0f172a">
      <circle cx="220" cy="322" r="6" fill="#16a34a"/><text x="234" y="326">even, bilateral, light centric contacts</text>
      <circle cx="220" cy="344" r="7" fill="none" stroke="#dc2626" stroke-width="2"/><text x="234" y="348">cantilever: light or out of contact</text>
      <text x="212" y="372">Shallow anterior guidance · no excursive</text>
      <text x="212" y="388">interferences · narrow, flat tables</text>
      <text x="212" y="408" fill="#64748b" font-size="10">Drago 2017 interim acrylic: CL/AP ≈ 0.5–0.6 did well</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="cl-title cl-desc">
  <title id="cl-title">Case selection checklist</title>
  <desc id="cl-desc">Go, caution, and no-go checklist categories for full-arch immediate load case selection.</desc>
  <rect width="720" height="480" fill="#f8fafc"/>
  <text x="360" y="32" text-anchor="middle" fill="#0f172a" font-family="system-ui,sans-serif" font-size="16" font-weight="700">Case selection scorecard — GO / CAUTION / NO</text>
  <rect x="24" y="56" width="216" height="400" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <rect x="24" y="56" width="216" height="44" rx="12" fill="#059669"/>
  <rect x="24" y="84" width="216" height="16" fill="#059669"/>
  <text x="132" y="84" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="15" font-weight="700">GO</text>
  <text x="40" y="130" fill="#065f46" font-family="system-ui,sans-serif" font-size="12">✓ Motivated, realistic goals</text>
  <text x="40" y="154" fill="#065f46" font-family="system-ui,sans-serif" font-size="12">✓ ASA I–II, controlled Dz</text>
  <text x="40" y="178" fill="#065f46" font-family="system-ui,sans-serif" font-size="12">✓ Bone for ≥4 implants</text>
  <text x="40" y="202" fill="#065f46" font-family="system-ui,sans-serif" font-size="12">✓ AP spread adequate</text>
  <text x="40" y="226" fill="#065f46" font-family="system-ui,sans-serif" font-size="12">✓ Restorative space OK</text>
  <text x="40" y="250" fill="#065f46" font-family="system-ui,sans-serif" font-size="12">✓ Transition zone hidden</text>
  <text x="40" y="274" fill="#065f46" font-family="system-ui,sans-serif" font-size="12">✓ Soft tissue manageable</text>
  <text x="40" y="298" fill="#065f46" font-family="system-ui,sans-serif" font-size="12">✓ Hygiene access planned</text>
  <text x="40" y="322" fill="#065f46" font-family="system-ui,sans-serif" font-size="12">✓ Expect torque ≥30–35 Ncm</text>
  <text x="40" y="346" fill="#065f46" font-family="system-ui,sans-serif" font-size="12">✓ No severe parafunction</text>
  <text x="40" y="370" fill="#065f46" font-family="system-ui,sans-serif" font-size="12">✓ Airway screened / OK</text>
  <text x="40" y="394" fill="#065f46" font-family="system-ui,sans-serif" font-size="12">✓ Lab / conversion ready</text>
  <text x="40" y="430" fill="#047857" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Proceed with protocol</text>
  <rect x="252" y="56" width="216" height="400" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <rect x="252" y="56" width="216" height="44" rx="12" fill="#d97706"/>
  <rect x="252" y="84" width="216" height="16" fill="#d97706"/>
  <text x="360" y="84" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="15" font-weight="700">CAUTION</text>
  <text x="268" y="130" fill="#92400e" font-family="system-ui,sans-serif" font-size="12">△ Mild–mod bruxism</text>
  <text x="268" y="154" fill="#92400e" font-family="system-ui,sans-serif" font-size="12">△ Smoker (counsel / quit)</text>
  <text x="268" y="178" fill="#92400e" font-family="system-ui,sans-serif" font-size="12">△ Borderline bone volume</text>
  <text x="268" y="202" fill="#92400e" font-family="system-ui,sans-serif" font-size="12">△ High smile / thin biotype</text>
  <text x="268" y="226" fill="#92400e" font-family="system-ui,sans-serif" font-size="12">△ Diabetes (controlled)</text>
  <text x="268" y="250" fill="#92400e" font-family="system-ui,sans-serif" font-size="12">△ Need limited graft</text>
  <text x="268" y="274" fill="#92400e" font-family="system-ui,sans-serif" font-size="12">△ Opposing natural / FPD</text>
  <text x="268" y="298" fill="#92400e" font-family="system-ui,sans-serif" font-size="12">△ Moderate airway risk</text>
  <text x="268" y="322" fill="#92400e" font-family="system-ui,sans-serif" font-size="12">△ Complex occlusion / VD</text>
  <text x="268" y="346" fill="#92400e" font-family="system-ui,sans-serif" font-size="12">△ Soft tissue excess (VME)</text>
  <text x="268" y="370" fill="#92400e" font-family="system-ui,sans-serif" font-size="12">△ Prior implant failures</text>
  <text x="268" y="394" fill="#92400e" font-family="system-ui,sans-serif" font-size="12">△ Team / lab bandwidth</text>
  <text x="268" y="430" fill="#b45309" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Modify plan or stage</text>
  <rect x="480" y="56" width="216" height="400" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <rect x="480" y="56" width="216" height="44" rx="12" fill="#dc2626"/>
  <rect x="480" y="84" width="216" height="16" fill="#dc2626"/>
  <text x="588" y="84" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="15" font-weight="700">NO / STOP</text>
  <text x="496" y="130" fill="#991b1b" font-family="system-ui,sans-serif" font-size="12">✗ Uncontrolled medical Dz</text>
  <text x="496" y="154" fill="#991b1b" font-family="system-ui,sans-serif" font-size="12">✗ Active IV bisphosphonate</text>
  <text x="496" y="178" fill="#991b1b" font-family="system-ui,sans-serif" font-size="12">✗ Severe untreated OSA</text>
  <text x="496" y="202" fill="#991b1b" font-family="system-ui,sans-serif" font-size="12">✗ Extreme parafunction</text>
  <text x="496" y="226" fill="#991b1b" font-family="system-ui,sans-serif" font-size="12">✗ Insufficient bone (no Z)</text>
  <text x="496" y="250" fill="#991b1b" font-family="system-ui,sans-serif" font-size="12">✗ Acute infection / sepsis</text>
  <text x="496" y="274" fill="#991b1b" font-family="system-ui,sans-serif" font-size="12">✗ Unrealistic expectations</text>
  <text x="496" y="298" fill="#991b1b" font-family="system-ui,sans-serif" font-size="12">✗ Poor hygiene / noncompliant</text>
  <text x="496" y="322" fill="#991b1b" font-family="system-ui,sans-serif" font-size="12">✗ No primary stability likely</text>
  <text x="496" y="346" fill="#991b1b" font-family="system-ui,sans-serif" font-size="12">✗ Heavy head/neck RT Hx</text>
  <text x="496" y="370" fill="#991b1b" font-family="system-ui,sans-serif" font-size="12">✗ Active psychosis / abuse</text>
  <text x="496" y="394" fill="#991b1b" font-family="system-ui,sans-serif" font-size="12">✗ Cannot afford maintenance</text>
  <text x="496" y="430" fill="#b91c1c" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Defer · refer · alternative</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="ps-title ps-desc">
  <title id="ps-title">All-on-4 placement sequence with tilted posterior implants</title>
  <desc id="ps-desc">Two occlusal-view schematics. Maxilla: two distal implants tilted along the anterior sinus walls with platforms near the second premolars, placed first, then two axial anterior implants in the lateral incisor to canine region avoiding the incisive canal. Mandible: two distal implants tilted distally with apices mesial to the mental foramen and anterior loop, placed first, then two axial anterior implants. A-P spread is marked between the anterior and posterior implant lines.</desc>
  <defs>
    <marker id="ps-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="720" height="520" fill="#f8fafc"/>
  <text x="360" y="28" text-anchor="middle" fill="#0f172a" font-family="system-ui,sans-serif" font-size="16" font-weight="700">Placement sequence — distal tilted first, then anterior axial</text>
  <rect x="20" y="45" width="330" height="410" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <text x="185" y="70" text-anchor="middle" fill="#0e7490" font-family="system-ui,sans-serif" font-size="13" font-weight="800">Maxilla (occlusal view)</text>

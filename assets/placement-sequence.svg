  <text x="384" y="92" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">↑ anterior</text>
  <circle cx="426.9" cy="226.6" r="7" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <path d="M426.9,217.6 q8,-10 4,-26" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3 2"/>
  <circle cx="643.1" cy="226.6" r="7" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <path d="M643.1,217.6 q-8,-10 -4,-26" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="535" y="310" text-anchor="middle" fill="#b45309" font-family="system-ui,sans-serif" font-size="10" font-weight="700">yellow = mental foramen + loop</text>
  <text x="535" y="324" text-anchor="middle" fill="#b45309" font-family="system-ui,sans-serif" font-size="10">(apex stays ≥2 mm mesial)</text>
  <circle cx="469.0" cy="162.7" r="11" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>
  <circle cx="469.0" cy="162.7" r="5" fill="#0f766e"/>
  <circle cx="469.0" cy="138.7" r="10" fill="#0f172a"/><text x="469.0" y="142.7" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="11" font-weight="800">3</text>
  <circle cx="601.0" cy="162.7" r="11" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>

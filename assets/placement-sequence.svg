  <path d="M650.4,256.9 L621.2,191.1 L610.0,195.3 L631.7,263.9 Z" fill="#94a3b8" stroke="#334155" stroke-width="1.5" opacity="0.95"/>
  <circle cx="641.1" cy="260.4" r="6" fill="#0f766e"/>
  <circle cx="615.1" cy="266.4" r="10" fill="#0f172a"/><text x="615.1" y="270.4" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="11" font-weight="800">2</text>
  <line x1="385" y1="162.7" x2="685" y2="162.7" stroke="#0f172a" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="385" y1="268.4" x2="685" y2="268.4" stroke="#0f172a" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="677" y1="165.7" x2="677" y2="265.4" stroke="#dc2626" stroke-width="2" marker-end="url(#ps-arrow)"/>
  <text x="673" y="219.6" text-anchor="end" fill="#b91c1c" font-family="system-ui,sans-serif" font-size="10" font-weight="700">A-P</text>
  <text x="535" y="425" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="11" font-weight="700">Tilt distally over the loop (~30–45°)</text>
  <text x="535" y="443" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="11">Anteriors: axial, watch lingual concavity</text>
  <text x="360" y="480" text-anchor="middle" fill="#0f172a" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Implants 1–2 (distal, tilted) set the A-P spread → 3–4 (anterior, axial) go in between</text>
  <text x="20" y="506" fill="#64748b" font-family="system-ui,sans-serif" font-size="9">Schematic, not to scale. Gray bar = implant body (apex end narrow); teal dot = platform. Follow your guide / system sequence.</text>
</svg>

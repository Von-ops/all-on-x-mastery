  <line x1="35" y1="268.4" x2="335" y2="268.4" stroke="#0f172a" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="327" y1="165.7" x2="327" y2="265.4" stroke="#dc2626" stroke-width="2" marker-end="url(#ps-arrow)"/>
  <text x="323" y="219.6" text-anchor="end" fill="#b91c1c" font-family="system-ui,sans-serif" font-size="10" font-weight="700">A-P</text>
  <text x="185" y="425" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="11" font-weight="700">Tilt along anterior sinus wall (~30–45°)</text>
  <text x="185" y="443" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="11">Anteriors: lateral/canine, lateral to canal</text>
  <rect x="370" y="45" width="330" height="410" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <text x="535" y="70" text-anchor="middle" fill="#0f766e" font-family="system-ui,sans-serif" font-size="13" font-weight="800">Mandible (occlusal view)</text>

<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Week 1 · All-on-X Mastery</title>
</head><body>
<p id="boot" style="font-family:system-ui;padding:1.5rem">Loading module…</p>
<script>
(async () => {
  const parts = [];
  for (let i = 0; i < 4; i++) {
    const t = await fetch('b64-' + i + '.txt').then(r => { if (!r.ok) throw new Error(r.status); return r.text(); });
    parts.push(t.trim());
  }
  const bin = Uint8Array.from(atob(parts.join('')), c => c.charCodeAt(0));
  const html = new TextDecoder('utf-8').decode(bin);
  document.open();
  document.write(html);
  document.close();
})().catch(e => { document.getElementById('boot').textContent = 'Load failed: ' + e; });
</script>
</body></html>

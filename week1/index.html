<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Week 1 · Foundations &amp; Case Selection · All-on-X Mastery</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div id="boot" style="padding:2rem;font-family:system-ui;color:#334155">Loading Week 1 module…</div>
  <script>
  (async () => {
    const [a, b] = await Promise.all([
      fetch('part1.fragment.html').then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }),
      fetch('part2.fragment.html').then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }),
    ]);
    const boot = document.getElementById('boot');
    if (boot) boot.remove();
    document.body.insertAdjacentHTML('beforeend', a + b);
    for (const src of ['../js/progress.js', '../js/patients.js']) {
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = reject;
        document.body.appendChild(s);
      });
    }
  })().catch(err => {
    const boot = document.getElementById('boot');
    if (boot) boot.textContent = 'Failed to load module: ' + err;
  });
  </script>
</body>
</html>
